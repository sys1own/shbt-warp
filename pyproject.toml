[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "shbt_warp"
version = "0.1.0"
description = "SHBT Holographic Warp Drive Simulator — Rust/PyO3 core with Python CLI and plotting"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.21",
]

[project.scripts]
shbt-warp-sim = "shbt_warp.cli:main"

[tool.maturin]
python-source = "python"
module-name = "shbt_warp._core"
features = ["extension-module"]
