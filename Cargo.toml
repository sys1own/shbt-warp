[package]
name = "shbt_warp"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
ndarray = "0.16"
nalgebra = { version = "0.33", features = ["rand"] }
num-complex = "0.4"
rand = "0.8"
rand_distr = "0.4"

[dev-dependencies]
approx = "0.5"
